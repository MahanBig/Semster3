name: Build and test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    name: Build and test Heimevernet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Vi bygger testprosjektet (som også bygger Heimevernet.Web) i stedet for hele løsningen, fordi
      # docker-compose.dcproj bare kan bygges av Visual Studio (dotnet på Linux kjenner ikke Microsoft.Docker.Sdk).
      - name: Restore dependencies
        run: dotnet restore ./Heimevernet.Web.UnitTests/Heimevernet.Web.UnitTests.csproj

      - name: Build projects
        run: dotnet build ./Heimevernet.Web.UnitTests/Heimevernet.Web.UnitTests.csproj --configuration Release --no-restore

      # Sjekker at Dockerfile fortsatt bygger, slik docker compose gjør.
      - name: Build Docker image
        run: docker build --file Heimevernet.Web/Dockerfile --tag heimevernet-web:ci .

      - name: Run tests
        run: dotnet test --project ./Heimevernet.Web.UnitTests/Heimevernet.Web.UnitTests.csproj --configuration Release --no-build --no-restore --verbosity normal
